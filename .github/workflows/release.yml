name: Melonenport Programm bauen

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'electron/**'
      - 'launcher/**'
      - 'build/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pakete installieren
        run: npm install
      - name: EXE bauen
        run: npx electron-builder --win --publish never
      - name: Version lesen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Melonenport ${{ steps.v.outputs.version }}
          make_latest: true
          draft: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
